upstream shipping_api {
    server shipping-api:3000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://shipping.ifrstech.com$request_uri;
}

# Redirect HTTPS requests to the IP address to the domain
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/ssl/ifrstech.com.cert;
    ssl_certificate_key /etc/ssl/ifrstech.com.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    return 301 https://shipping.ifrstech.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shipping.ifrstech.com;

    ssl_certificate /etc/ssl/ifrstech.com.cert;
    ssl_certificate_key /etc/ssl/ifrstech.com.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    location / {
        proxy_pass http://shipping_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/rows scans the full CSV; allow slow upstream responses under load.
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
