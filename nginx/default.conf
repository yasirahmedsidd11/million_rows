events {}

http {
    upstream shipping-api {
        server shipping-api:3000; 
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        return 301 https://shipping.ifrstech.com$request_uri;
    }

    # Redirect HTTPS requests to the IP address to the domain
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        # SSL certificate and key for the IP requests (same as domain)
        ssl_certificate /etc/ssl/ifrstech.com.cert;
        ssl_certificate_key /etc/ssl/ifrstech.com.pem;

        return 301 https://shipping.ifrstech.com$request_uri;
    }

    # Serve the domain with SSL
    server {
        listen 443 ssl;
        server_name shipping.ifrstech.com;

        # SSL certificate and key
        ssl_certificate /etc/ssl/ifrstech.com.cert;
        ssl_certificate_key /etc/ssl/ifrstech.com.pem;

        client_max_body_size 50M;

        location / {
            proxy_pass http://shipping-api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /media/ {
            alias /app/media/;

        }
    }
}

 