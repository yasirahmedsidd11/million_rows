server {
    listen 80;
    server_name shipping.ifrstech.com;

    location / {
        proxy_pass http://shipping-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # /api/rows scans the full CSV; allow slow upstream responses under load.
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

}

server {
    listen 443 ssl;
    server_name shipping.ifrstech.com;

    ssl_certificate     /etc/letsencrypt/live/shipping.ifrstech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shipping.ifrstech.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://shipping-api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # allow slow upstream responses
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
