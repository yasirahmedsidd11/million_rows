services:
  shipping-api:
    build: .
    expose:
      - "3000"
    restart: unless-stopped
    environment:
      PORT: "3000"
      CSV_PATH: /app/data/rows.csv
      # Set to 1 to regenerate CSV on every container start (slow).
      # GENERATE_CSV: "0"
      # Smaller dataset for quicker first boot (optional):
      # TOTAL_ROWS: "10000"
    volumes:
      - csv_data:/app/data

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SSL_CERT_PATH:-./ssl/ifrstech.com.cert}:/etc/ssl/ifrstech.com.cert:ro
      - ${SSL_KEY_PATH:-./ssl/ifrstech.com.pem}:/etc/ssl/ifrstech.com.pem:ro
    depends_on:
      - shipping-api
    restart: unless-stopped

volumes:
  csv_data:
